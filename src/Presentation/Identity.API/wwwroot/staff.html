<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computer Seekho - Staff Operational Portal</title>
  <style>
    :root {
      --bg-light: #f8fafc;
      --bg-white: #ffffff;
      --accent-blue: #2563eb;
      --text-dark: #0f172a;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-light); color: var(--text-dark); display: flex; height: 100vh; overflow: hidden; }

    .auth-container {
      margin: auto; background: var(--bg-white); padding: 2.5rem; border-radius: 12px;
      width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid var(--border-color);
    }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-header h1 { color: var(--accent-blue); font-size: 1.8rem; margin-bottom: 0.5rem; font-weight: 700; }

    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.875rem; }
    .form-control { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; outline: none; }
    .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--accent-blue); color: white; width: 100%; }

    .toast { position: fixed; top: 20px; right: 20px; padding: 1rem 1.5rem; border-radius: 8px; color: white; z-index: 1000; display: none; }
    .toast-success { background: #16a34a; }
    .toast-error { background: #dc2626; }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <div id="auth-view" style="width:100%; display:flex;">
    <div class="auth-container">
      <div class="auth-header">
        <h1>Computer Seekho</h1>
        <p>Staff Operations Workspace</p>
      </div>
      <form id="staff-login-form">
        <div class="form-group">
          <label>Username / Email</label>
          <input type="text" id="staff-username" class="form-control" placeholder="Enter username or email" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="staff-password" class="form-control" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary">Sign In to Workspace</button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8137/api';

    function showNotification(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = `toast ${isError ? 'toast-error' : 'toast-success'}`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    document.getElementById('staff-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const usernameInput = document.getElementById('staff-username').value;
      const passwordInput = document.getElementById('staff-password').value;

      try {
        const response = await fetch(`${API_BASE}/Auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: usernameInput, password: passwordInput })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          const authData = data.data;
          const token = authData.token;

          // Write token to port 8137 localStorage
          localStorage.setItem('cs_admin_token', token);
          localStorage.setItem('token', token);
          localStorage.setItem('cs_admin_staff', JSON.stringify({
            staffName: authData.staffName,
            email: authData.email,
            roles: authData.roles,
            permissions: authData.permissions
          }));

          showNotification('Login Successful! Redirecting...');

          // Pass the JWT token across ports in the redirect URL
          setTimeout(() => {
            window.location.href = `http://localhost:5173/admin/dashboard?token=${encodeURIComponent(token)}`;
          }, 800);
        } else {
          showNotification(data.message || 'Invalid username or password.', true);
        }
      } catch (err) {
        showNotification('Network connection error', true);
      }
    });
  </script>
</body>
</html>
