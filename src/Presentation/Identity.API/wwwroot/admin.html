<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computer Seekho - SuperAdmin IAM Portal</title>
  <style>
    :root {
      --bg-light: #f8fafc;
      --bg-white: #ffffff;
      --bg-sidebar: #064e3b;
      --sidebar-hover: #047857;
      --accent-green: #059669;
      --accent-green-hover: #047857;
      --accent-danger: #dc2626;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-light); color: var(--text-dark); display: flex; height: 100vh; overflow: hidden; }

    .auth-container {
      margin: auto; background: var(--bg-white); padding: 2.5rem; border-radius: 12px;
      width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid var(--border-color);
    }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-header h1 { color: var(--accent-green); font-size: 1.8rem; margin-bottom: 0.5rem; font-weight: 700; }
    .auth-header p { color: var(--text-muted); font-size: 0.9rem; }

    #dashboard-view { display: flex; width: 100%; height: 100vh; display: none; }
    .sidebar { width: 260px; background: var(--bg-sidebar); display: flex; flex-direction: column; }
    .sidebar-brand { padding: 1.5rem; font-size: 1.25rem; font-weight: 700; color: #ffffff; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .nav-links { list-style: none; padding: 1rem 0; flex: 1; }
    .nav-item { padding: 0.85rem 1.5rem; color: #ecfdf5; cursor: pointer; font-weight: 500; }
    .nav-item:hover, .nav-item.active { background: var(--sidebar-hover); color: #ffffff; border-left: 4px solid #34d399; }
    .user-profile { padding: 1rem 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; color: #ecfdf5; }
    .main-content { flex: 1; overflow-y: auto; padding: 2.5rem; background: var(--bg-light); }

    .card { background: var(--bg-white); border-radius: 10px; padding: 1.75rem; border: 1px solid var(--border-color); margin-bottom: 1.5rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.875rem; }
    .form-control { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; outline: none; }
    .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--accent-green); color: white; }
    .btn-danger { background: var(--accent-danger); color: white; }
    .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 1rem; border-bottom: 1px solid var(--border-color); }
    th { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; font-weight: 700; background: #f8fafc; }

    .toast { position: fixed; top: 20px; right: 20px; padding: 1rem 1.5rem; border-radius: 8px; color: white; z-index: 1000; display: none; }
    .toast-success { background: var(--accent-green); }
    .toast-error { background: var(--accent-danger); }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <!-- SUPERADMIN AUTH VIEW -->
  <div id="auth-view" style="width:100%; display:flex;">
    <div class="auth-container">
      <div class="auth-header">
        <h1>Computer Seekho</h1>
        <p><strong>SuperAdmin</strong> Identity & Access Portal</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label>Admin Email</label>
          <input type="email" id="login-email" class="form-control" value="admin@computerseekho.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" class="form-control" value="Admin@1234" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Sign In as SuperAdmin</button>
      </form>
    </div>
  </div>

  <!-- SUPERADMIN DASHBOARD VIEW -->
  <div id="dashboard-view">
    <aside class="sidebar">
      <div class="sidebar-brand">Seekho IAM Admin</div>
      <ul class="nav-links">
        <li class="nav-item active" onclick="switchTab('staff', event)">Staff Directory</li>
        <li class="nav-item" onclick="switchTab('register', event)">Register Staff</li>
        <li class="nav-item" onclick="switchTab('roles', event)">Roles & Permissions</li>
      </ul>
      <div class="user-profile">
        <div>
          <div id="user-display-name" style="font-weight:600; font-size:0.9rem;"></div>
          <div id="user-display-role" style="font-size:0.75rem; color:#a7f3d0;"></div>
        </div>
        <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div id="tab-staff" class="tab-content">
        <h2>Staff Directory</h2>
        <div class="card">
          <button class="btn btn-primary btn-sm" onclick="loadStaff()" style="float:right;">Refresh</button>
          <table>
            <thead>
              <tr><th>Name</th><th>Email</th><th>Department</th><th>Roles</th><th>Actions</th></tr>
            </thead>
            <tbody id="staff-table-body"></tbody>
          </table>
        </div>
      </div>

      <div id="tab-register" class="tab-content" style="display:none;">
        <h2>Register New Staff Member</h2>
        <div class="card" style="max-width: 500px;">
          <form id="register-staff-form">
            <div class="form-group"><label>Name</label><input type="text" id="reg-name" class="form-control" required /></div>
            <div class="form-group"><label>Email</label><input type="email" id="reg-email" class="form-control" required /></div>
            <div class="form-group"><label>Department</label><input type="text" id="reg-dept" class="form-control" required /></div>
            <div class="form-group"><label>Role</label><select id="reg-role" class="form-control" required></select></div>
            <div class="form-group"><label>Password</label><input type="password" id="reg-password" class="form-control" required /></div>
            <button type="submit" class="btn btn-primary">Create Staff Account</button>
          </form>
        </div>
      </div>

      <div id="tab-roles" class="tab-content" style="display:none;">
        <h2>Access Control Configuration</h2>
        <div class="grid-2">
          <div class="card">
            <h3>System Roles</h3>
            <div id="roles-list" style="margin-top:1rem;"></div>
          </div>
          <div class="card">
            <h3>Create Role</h3>
            <form id="create-role-form">
              <div class="form-group"><label>Role Name</label><input type="text" id="role-name" class="form-control" required /></div>
              <div class="form-group"><label>Description</label><input type="text" id="role-desc" class="form-control" required /></div>
              <div class="form-group">
                <label>Assign Permissions</label>
                <div id="permissions-checkboxes" style="max-height:180px; overflow-y:auto; padding:0.5rem; background:#f8fafc; border:1px solid var(--border-color);"></div>
              </div>
              <button type="submit" class="btn btn-primary">Save Role</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Updated to point to Security Microservice on Docker Port 8137
    const API_BASE = 'http://localhost:8137/api';
    let token = localStorage.getItem('admin_token');

    function showNotification(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = `toast ${isError ? 'toast-error' : 'toast-success'}`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    async function apiFetch(endpoint, method = 'GET', body = null) {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;

      const config = { method, headers };
      if (body) config.body = JSON.stringify(body);

      try {
        const response = await fetch(`${API_BASE}${endpoint}`, config);
        const data = await response.json();
        if (!response.ok) return { success: false, message: data.message || 'Request failed' };
        return data;
      } catch (err) {
        showNotification('Network connection error', true);
        return null;
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const res = await apiFetch('/Auth/login', 'POST', { email, password });
      if (res && res.success) {
        const roles = res.data.roles || [];
        
        // STRICT ROLE CHECK: Only SuperAdmin allowed in this portal
        if (!roles.includes('SuperAdmin')) {
          showNotification('Access Denied! You must be a SuperAdmin to enter this portal.', true);
          return;
        }

        token = res.data.token;
        localStorage.setItem('admin_token', token);
        localStorage.setItem('admin_userInfo', JSON.stringify(res.data));
        showNotification('SuperAdmin Authenticated!');
        initDashboard();
      } else {
        showNotification(res?.message || 'Login failed', true);
      }
    });

    function logout() {
      localStorage.removeItem('admin_token');
      localStorage.removeItem('admin_userInfo');
      token = null;
      document.getElementById('dashboard-view').style.display = 'none';
      document.getElementById('auth-view').style.display = 'flex';
    }

    function initDashboard() {
      const userInfo = JSON.parse(localStorage.getItem('admin_userInfo'));
      if (!userInfo) return logout();

      document.getElementById('auth-view').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'flex';
      document.getElementById('user-display-name').innerText = userInfo.staffName;
      document.getElementById('user-display-role').innerText = userInfo.roles.join(', ');

      loadStaff();
      loadRoles();
      loadPermissions();
    }

    function switchTab(tabName, evt) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).style.display = 'block';
      if (evt?.currentTarget) evt.currentTarget.classList.add('active');
    }

    async function loadStaff() {
      const res = await apiFetch('/Staff');
      if (res && res.success) {
        document.getElementById('staff-table-body').innerHTML = res.data.map(u => `
          <tr>
            <td><strong>${u.staffName}</strong></td>
            <td>${u.email}</td>
            <td>${u.department || 'N/A'}</td>
            <td>${u.roles.join(', ')}</td>
            <td><button class="btn btn-danger btn-sm" onclick="deleteStaff('${u.id}', '${u.staffName}')">Delete</button></td>
          </tr>
        `).join('');
      }
    }

    async function deleteStaff(id, name) {
      if (confirm(`Delete '${name}'?`)) {
        const res = await apiFetch(`/Staff/${id}`, 'DELETE');
        if (res && res.success) { showNotification('Deleted'); loadStaff(); }
      }
    }

    document.getElementById('register-staff-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        staffName: document.getElementById('reg-name').value,
        email: document.getElementById('reg-email').value,
        department: document.getElementById('reg-dept').value,
        role: document.getElementById('reg-role').value,
        password: document.getElementById('reg-password').value
      };

      const res = await apiFetch('/Auth/register-staff', 'POST', body);
      if (res && res.success) {
        showNotification('Staff Created!');
        e.target.reset();
        loadStaff();
        switchTab('staff');
      } else { showNotification(res?.message || 'Failed', true); }
    });

    async function loadRoles() {
      const res = await apiFetch('/Role');
      if (res && res.success) {
        document.getElementById('reg-role').innerHTML = res.data.map(r => `<option value="${r.name}">${r.name}</option>`).join('');
        document.getElementById('roles-list').innerHTML = res.data.map(r => `
          <div style="padding:0.5rem 0; border-bottom:1px solid #e2e8f0;">
            <strong>${r.name}</strong> - <small>${r.description || 'No desc'}</small>
          </div>
        `).join('');
      }
    }

    async function loadPermissions() {
      const res = await apiFetch('/Permission');
      if (res && res.success) {
        document.getElementById('permissions-checkboxes').innerHTML = res.data.map(p => `
          <label style="display:block; margin-bottom:0.3rem;"><input type="checkbox" value="${p.id}" class="perm-check" /> ${p.name}</label>
        `).join('');
      }
    }

    document.getElementById('create-role-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const selectedPerms = Array.from(document.querySelectorAll('.perm-check:checked')).map(cb => Number(cb.value)).filter(id => !isNaN(id));
      const body = {
        roleName: document.getElementById('role-name').value.trim(),
        description: document.getElementById('role-desc').value.trim(),
        permissionIds: selectedPerms
      };

      const res = await apiFetch('/Role', 'POST', body);
      if (res && res.success) {
        showNotification('Role Created!');
        e.target.reset();
        loadRoles();
      } else { showNotification(res?.message || 'Failed', true); }
    });

    if (token) initDashboard();
  </script>
</body>
</html>
